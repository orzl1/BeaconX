  /api/v1/traffic/{id}/replay:
    parameters:
      - name: id
        in: path
        required: true
        description: 资源标识
        schema:
          type: integer
          format: int64
    post:
      tags: [traffic]
      summary: 重放 http_probe 采集记录（走 executor 策略门）
      description: |
        重放经 Options.Executor 执行 http_probe：策略门/审批/审计/证据采集。
        未接线 503 executor_unavailable；deny/审批拒绝 403；超时 409；未知工具/其它 502。
        响应 policy_gated=true，traffic_id 为 best-effort（可为 0）。
      operationId: replayTraffic
      responses:
        "200":
          description: 重放结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrafficReplayResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: 策略拒绝或审批拒绝
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/Unavailable"
