                $ref: "#/components/schemas/AssetIdentityList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
    post:
      tags: [assets]
      summary: 新增资产身份键（归一化后写入）
      description: 身份键先经 domain/asset.Normalize 归一化；重复/被占用返回 409。
      operationId: addAssetIdentity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssetIdentityCreateRequest"
      responses:
        "201":
          description: 已创建的身份键
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetIdentity"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/missions/{id}/assets:
    parameters:
      - $ref: "#/components/parameters/MissionID"
    get:
      tags: [assets, missions]
      summary: 任务已登记资产
