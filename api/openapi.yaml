openapi: 3.0.3
info:
  title: BeaconX API
  version: 1.1.0
  description: |
    BeaconX M6.2 HTTP API：系统探针、任务生命周期、AI 规划预算、工具审批与审计、
    流量采集与证据校验、自更新、SSE 事件流；M6.2 已补齐 B1–B5：企业/资产/任务资产/
    覆盖率、任务范围/计划/作战图、发现/复测/报告、流量/命令/LLM/用量/Dashboard，以及
    B4/B5 的策略规则/审批/日志/通知/设置/MCP/Skills/Agents/Workspace/Sync/证据增强，以及 B6 的活动流、技能版本、重放策略门、证据轮换、graph after_id、Dashboard hourly 与 stdio/配额硬化。
    接口统一在 /api/v1 下版本管理；本文档是生成客户端的唯一来源，
    与 internal/httpapi 中的声明式路由表同步演进。
servers:
  - url: http://127.0.0.1:6969
security:
  - bearerAuth: []
tags:
  - name: system
    description: 系统探针与元信息（公开端点）
  - name: missions
    description: 任务生命周期管理（需要令牌）
  - name: events
    description: 任务事件流（需要令牌，SSE 也可用查询参数）
  - name: approvals
    description: 工具调用的审批列表与决策（需要令牌）
  - name: evidence
    description: 流量采集记录、证据快照与完整性校验（需要令牌）
  - name: update
    description: 自更新检查、安装与回滚（需要令牌）
  - name: companies
    description: 企业与「企业级资产范围」（需要令牌）
  - name: assets
    description: 资产、身份键与任务资产关联/覆盖率（需要令牌）
  - name: graph
    description: 任务范围、计划步骤、作战图与节点（需要令牌）
  - name: findings
    description: 任务发现、发现证据关联与状态流转（需要令牌）
  - name: retests
    description: 复测请求与结果（需要令牌）
  - name: report
    description: 任务 Markdown 报告（需要令牌）
  - name: insights
    description: 流量详情/正文、命令历史、LLM 记录与用量聚合（需要令牌）
  - name: dashboard
    description: 首页 Dashboard 聚合计数（需要令牌）
  - name: logs
    description: 应用日志查询与实时流（需要令牌）
  - name: settings
    description: 运行时设置（🟡 仅持久化+可读，未热生效）
  - name: policy
    description: 策略规则与裁决试算（需要令牌）
  - name: notifications
    description: 通知渠道与投递记录（需要令牌）
  - name: mcp
    description: MCP 端点与工具清单（需要令牌）
  - name: skills
    description: 技能包与文件（需要令牌）
  - name: agents
    description: Agent 定义（🟡 未接入运行时装配）
  - name: workspace
    description: 任务工作区文件（需要令牌）
  - name: sync
    description: 外部数据源同步（需要令牌）
  - name: traffic
    description: 流量导出/重放/任务级清理（需要令牌）
  - name: activity
    description: 全局活动流（需要令牌）
paths:
  /healthz:
    get:
      tags: [system]
      summary: 存活探针
      operationId: healthz
      security: []
      responses:
        "200":
          description: 进程存活
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: ok
  /readyz:
    get:
      tags: [system]
      summary: 就绪探针
      operationId: readyz
      security: []
      responses:
        "200":
          description: 已就绪，可以对外提供服务
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
        "503":
          description: 未就绪（依赖不可用或迁移尚未应用）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
  /api/v1/system/info:
    get:
      tags: [system]
      summary: 构建与 schema 信息
      operationId: systemInfo
      security: []
      responses:
        "200":
          description: 服务信息
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemInfo"
  /api/v1/system/tenant:
    get:
      tags: [system]
      summary: 本次请求解析到的租户
      operationId: systemTenant
      security: []
      responses:
        "200":
          description: 租户标识
          content:
            application/json:
              schema:
                type: object
                required: [tenant_id]
                properties:
                  tenant_id:
                    type: integer
                    format: int64
  /api/v1/missions:
    post:
      tags: [missions]
      summary: 创建任务
      description: 创建后任务进入 queued，由准入调度按 FIFO 启动。
      operationId: createMission
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MissionCreateRequest"
      responses:
        "201":
          description: 任务已创建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Mission"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"
    get:
      tags: [missions]
      summary: 任务列表
      operationId: listMissions
      parameters:
        - name: status
          in: query
          required: false
          description: 按任务状态过滤；省略时返回全部状态。
          schema:
            $ref: "#/components/schemas/MissionStatus"
        - name: limit
          in: query
          required: false
          description: 返回条数，默认 50，最大 200（超出按 200 截断）。
          schema:
            type: integer
            default: 50
            minimum: 1
      responses:
        "200":
          description: 任务列表（按 id 倒序）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MissionList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/missions/{id}:
    parameters:
      - $ref: "#/components/parameters/MissionID"
    get:
      tags: [missions]
      summary: 任务详情
      operationId: getMission
      responses:
        "200":
          description: 任务详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Mission"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [missions]
      summary: 删除任务
      description: 级联删除任务的事件、节点、边、锚点、范围与资产链接，返回 204。
      operationId: deleteMission
      responses:
        "204":
          description: 已删除
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/missions/{id}/pause:
    parameters:
      - $ref: "#/components/parameters/MissionID"
    post:
      tags: [missions]
      summary: 暂停任务
      description: 仅运行中的任务可暂停；暂停后释放动作租约，可用 resume 恢复。
      operationId: pauseMission
      responses:
        "200":
          description: 暂停后的任务
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Mission"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/missions/{id}/resume:
    parameters:
      - $ref: "#/components/parameters/MissionID"
    post:
      tags: [missions]
      summary: 恢复任务
      description: 只有已暂停的任务可恢复；恢复后回到 queued，等待重新准入。
      operationId: resumeMission
      responses:
        "200":
          description: 恢复后的任务
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Mission"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/missions/{id}/cancel:
    parameters:
      - $ref: "#/components/parameters/MissionID"
    post:
      tags: [missions]
      summary: 取消任务
      description: 排队中、运行中、已暂停或收尾中的任务均可取消；结束后进入 cancelled 终态。
      operationId: cancelMission
      responses:
        "200":
          description: 取消后的任务
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Mission"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/missions/{id}/events:
    parameters:
      - $ref: "#/components/parameters/MissionID"
    get:
      tags: [events]
      summary: 任务事件流（SSE）
      description: |
        以 Server-Sent Events 推送任务事件。处理顺序为先订阅内存总线、再回放
        mission_events，最后转发实时事件；回放按事件 id 升序，实时事件按 id 去重。

        游标优先取 Last-Event-ID 请求头，其次取 ?since= 查询参数；空值、非法值
        与负数按 0 处理。单次回放上限 500 条，心跳为注释行 `: ping`（默认 20s）。

        帧格式：
        `id: <事件 id>` / `event: <事件类型>` / `data: <JSON>`，以空行结束。

        令牌可用 Authorization: Bearer，也可用 ?token= 查询参数携带（EventSource 无法自定义请求头）。
      operationId: missionEvents
      security:
        - bearerAuth: []
        - tokenQuery: []
      parameters:
        - name: Last-Event-ID
          in: header
          required: false
          description: 客户端已有的事件 id 游标；浏览器 EventSource 断线重连时自动携带。
          schema:
            type: string
        - name: since
          in: query
          required: false
          description: 事件 id 游标；仅在缺少 Last-Event-ID 时使用。
          schema:
            type: integer
            format: int64
            default: 0
      responses:
        "200":
          description: SSE 事件流
          content:
            text/event-stream:
              schema:
                type: string
                description: SSE 帧序列（id / event / data 行，空行分隔；心跳为注释行）。
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/missions/{id}/audit:
    parameters:
      - $ref: "#/components/parameters/MissionID"
    get:
      tags: [missions]
      summary: 任务工具调用审计
      description: 返回任务下每次工具调用的策略裁决与执行结果，按 id 倒序，最多 200 条。
      operationId: missionAudit
      responses:
        "200":
          description: 审计列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/approvals:
    get:
      tags: [approvals]
      summary: 审批列表
      description: 按 id 倒序返回待人工决策或历史审批；可按状态过滤。
      operationId: listApprovals
      parameters:
        - name: status
          in: query
          required: false
          description: 按审批状态过滤。
          schema:
            type: string
            enum: [pending, approved, rejected, timeout, cancelled]
        - name: limit
          in: query
          required: false
          description: 返回条数，默认 50；大于 200 时按 50 处理。
          schema:
            type: integer
            default: 50
            minimum: 1
      responses:
        "200":
          description: 审批列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/approvals/{id}/decide:
    parameters:
      - $ref: "#/components/parameters/ApprovalID"
    post:
      tags: [approvals]
      summary: 审批决策
      description: 批准或拒绝一条 pending 审批；已处理或不存在返回 409。
      operationId: decideApproval
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecideApprovalRequest"
      responses:
        "200":
          description: 决策后的审批
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Approval"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/missions/{id}/traffic:
    parameters:
      - $ref: "#/components/parameters/MissionID"
    get:
      tags: [missions]
      summary: 任务流量采集记录
      description: 按 id 倒序返回工具调用的两阶段采集记录，最多 200 条。
      operationId: listTraffic
      responses:
        "200":
          description: 采集记录列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrafficList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
    delete:
      tags: [missions, traffic]
      summary: 批量清理任务采集行（保留证据快照/正文）
      description: 删除该任务全部 traffic_exchanges 行；已冻结证据与正文 blob 保留。成功 204。
      operationId: deleteMissionTraffic
      responses:
        "204":
          description: 已删除
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/traffic/{id}/evidence:
    parameters:
      - $ref: "#/components/parameters/TrafficID"
    post:
      tags: [evidence]
      summary: 把采集记录冻结为证据
      description: 只有 phase=result 的采集记录可以冻结；成功返回 201 与含签名的证据快照，未完成的采集返回 409。
      operationId: createEvidence
      responses:
        "201":
          description: 证据快照已创建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceSnapshot"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/evidence/{id}/verify:
    parameters:
      - $ref: "#/components/parameters/EvidenceID"
    get:
      tags: [evidence]
      summary: 校验证据完整性
      description: 重算快照签名并校验请求/响应正文的哈希；任一处被篡改返回 409 tampered。
      operationId: verifyEvidence
      responses:
        "200":
          description: 校验结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifyResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Tampered"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/system/update/check:
    get:
      tags: [update]
      summary: 检查新版本
      description: 查询 GitHub 最新 Release，比较版本并返回本平台资产信息；未配置自更新时返回 503 update_unavailable。
      operationId: updateCheck
      responses:
        "200":
          description: 检查结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateCheckResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/system/update/apply:
    post:
      tags: [update]
      summary: 下载并安装新版本
      description: 检查 → 下载本平台 zip → SHA256SUMS 校验 → --version 冒烟 → 备份 .old → 替换二进制；成功需重启生效，失败返回 409 update_failed。
      operationId: updateApply
      responses:
        "200":
          description: 安装结果（有更新或无更新）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateApplyResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/UpdateConflict"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/system/update/rollback:
    post:
      tags: [update]
      summary: 回滚到上一版本
      description: 用 <binary>.old 还原上一版本；无备份或回滚失败返回 409 rollback_failed，需重启生效。
      operationId: updateRollback
      responses:
        "200":
          description: 回滚结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RollbackResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/UpdateConflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/companies:
    get:
      tags: [companies]
      summary: 企业列表
      description: |
        按 id 升序返回当前租户的企业。`q` 对 name 与 slug 做模糊匹配（大小写不敏感，
        `%` 与 `_` 按字面量处理）；`limit` 缺省 50、上限 200。
      operationId: listCompanies
      parameters:
        - $ref: "#/components/parameters/LimitQuery"
        - $ref: "#/components/parameters/CompanySearchQuery"
      responses:
        "200":
          description: 企业列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"
    post:
      tags: [companies]
      summary: 创建企业
      description: name 与 slug 均为必填；同租户内 slug 重复返回 409。
      operationId: createCompany
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyCreateRequest"
      responses:
        "201":
          description: 企业已创建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/companies/{id}:
    parameters:
      - $ref: "#/components/parameters/CompanyID"
    get:
      tags: [companies]
      summary: 企业详情
      operationId: getCompany
      responses:
        "200":
          description: 企业详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
    patch:
      tags: [companies]
      summary: 更新企业
      description: 只更新传入且非空的字段；空对象按无变更（幂等）处理。slug 与其他企业重复返回 409。
      operationId: updateCompany
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyUpdateRequest"
      responses:
        "200":
          description: 更新后的企业
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
    delete:
      tags: [companies]
      summary: 删除企业
      description: 企业级资产范围随外键级联删除；返回 204。
      operationId: deleteCompany
      responses:
        "204":
          description: 已删除
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/companies/{id}/scope:
    parameters:
      - $ref: "#/components/parameters/CompanyID"
    get:
      tags: [companies]
      summary: 企业资产范围列表
      operationId: listCompanyScope
      responses:
