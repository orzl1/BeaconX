openapi: 3.0.3
info:
  title: BeaconX API
  version: 0.7.0
  description: |
    BeaconX M6 HTTP API：系统探针、任务生命周期、AI 规划预算、工具审批与审计、
    流量采集与证据校验、自更新与 SSE 事件流；M6.2 补齐企业、企业资产范围、
    资产身份、任务资产关联与覆盖率查询。
    接口统一在 /api/v1 下版本管理；本文档是生成客户端的唯一来源，
    与 internal/httpapi 中的声明式路由表同步演进。
servers:
  - url: http://127.0.0.1:6969
security:
  - bearerAuth: []
tags:
  - name: system
    description: 系统探针与元信息（公开端点）
  - name: missions
    description: 任务生命周期管理（需要令牌）
  - name: events
    description: 任务事件流（需要令牌，SSE 也可用查询参数）
  - name: approvals
    description: 工具调用的审批列表与决策（需要令牌）
  - name: evidence
    description: 流量采集记录、证据快照与完整性校验（需要令牌）
  - name: update
    description: 自更新检查、安装与回滚（需要令牌）
  - name: companies
    description: 企业与「企业级资产范围」（需要令牌）
  - name: assets
    description: 资产、身份键与任务资产关联/覆盖率（需要令牌）
paths:
  /healthz:
    get:
      tags: [system]
      summary: 存活探针
      operationId: healthz
      security: []
      responses:
        "200":
          description: 进程存活
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: ok
  /readyz:
    get:
      tags: [system]
      summary: 就绪探针
      operationId: readyz
      security: []
      responses:
        "200":
          description: 已就绪，可以对外提供服务
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
        "503":
          description: 未就绪（依赖不可用或迁移尚未应用）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
  /api/v1/system/info:
    get:
      tags: [system]
      summary: 构建与 schema 信息
      operationId: systemInfo
      security: []
      responses:
        "200":
          description: 服务信息
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemInfo"
  /api/v1/system/tenant:
    get:
      tags: [system]
      summary: 本次请求解析到的租户
      operationId: systemTenant
      security: []
      responses:
        "200":
          description: 租户标识
          content:
            application/json:
              schema:
                type: object
                required: [tenant_id]
                properties:
                  tenant_id:
                    type: integer
                    format: int64
  /api/v1/missions:
    post:
      tags: [missions]
      summary: 创建任务
      description: 创建后任务进入 queued，由准入调度按 FIFO 启动。
      operationId: createMission
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MissionCreateRequest"
      responses:
        "201":
          description: 任务已创建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Mission"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"
    get:
      tags: [missions]
      summary: 任务列表
      operationId: listMissions
      parameters:
        - name: status
          in: query
          required: false
          description: 按任务状态过滤；省略时返回全部状态。
          schema:
            $ref: "#/components/schemas/MissionStatus"
        - name: limit
          in: query
          required: false
          description: 返回条数，默认 50，最大 200（超出按 200 截断）。
          schema:
            type: integer
            default: 50
            minimum: 1
      responses:
        "200":
          description: 任务列表（按 id 倒序）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MissionList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/missions/{id}:
    parameters:
      - $ref: "#/components/parameters/MissionID"
    get:
      tags: [missions]
      summary: 任务详情
      operationId: getMission
      responses:
        "200":
          description: 任务详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Mission"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [missions]
      summary: 删除任务
      description: 级联删除任务的事件、节点、边、锚点、范围与资产链接，返回 204。
      operationId: deleteMission
      responses:
        "204":
          description: 已删除
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/missions/{id}/pause:
    parameters:
      - $ref: "#/components/parameters/MissionID"
    post:
      tags: [missions]
      summary: 暂停任务
      description: 仅运行中的任务可暂停；暂停后释放动作租约，可用 resume 恢复。
      operationId: pauseMission
      responses:
        "200":
          description: 暂停后的任务
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Mission"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/missions/{id}/resume:
    parameters:
      - $ref: "#/components/parameters/MissionID"
    post:
      tags: [missions]
      summary: 恢复任务
      description: 只有已暂停的任务可恢复；恢复后回到 queued，等待重新准入。
      operationId: resumeMission
      responses:
        "200":
          description: 恢复后的任务
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Mission"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/missions/{id}/cancel:
    parameters:
      - $ref: "#/components/parameters/MissionID"
    post:
      tags: [missions]
      summary: 取消任务
      description: 排队中、运行中、已暂停或收尾中的任务均可取消；结束后进入 cancelled 终态。
      operationId: cancelMission
      responses:
        "200":
          description: 取消后的任务
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Mission"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/missions/{id}/events:
    parameters:
      - $ref: "#/components/parameters/MissionID"
    get:
      tags: [events]
      summary: 任务事件流（SSE）
      description: |
        以 Server-Sent Events 推送任务事件。处理顺序为先订阅内存总线、再回放
        mission_events，最后转发实时事件；回放按事件 id 升序，实时事件按 id 去重。

        游标优先取 Last-Event-ID 请求头，其次取 ?since= 查询参数；空值、非法值
        与负数按 0 处理。单次回放上限 500 条，心跳为注释行 `: ping`（默认 20s）。

        帧格式：
        `id: <事件 id>` / `event: <事件类型>` / `data: <JSON>`，以空行结束。

        令牌可用 Authorization: Bearer，也可用 ?token= 查询参数携带（EventSource 无法自定义请求头）。
      operationId: missionEvents
      security:
        - bearerAuth: []
        - tokenQuery: []
      parameters:
        - name: Last-Event-ID
          in: header
          required: false
          description: 客户端已有的事件 id 游标；浏览器 EventSource 断线重连时自动携带。
          schema:
            type: string
        - name: since
          in: query
          required: false
          description: 事件 id 游标；仅在缺少 Last-Event-ID 时使用。
          schema:
            type: integer
            format: int64
            default: 0
      responses:
        "200":
          description: SSE 事件流
          content:
            text/event-stream:
              schema:
                type: string
                description: SSE 帧序列（id / event / data 行，空行分隔；心跳为注释行）。
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/missions/{id}/audit:
    parameters:
      - $ref: "#/components/parameters/MissionID"
    get:
      tags: [missions]
      summary: 任务工具调用审计
      description: 返回任务下每次工具调用的策略裁决与执行结果，按 id 倒序，最多 200 条。
      operationId: missionAudit
      responses:
        "200":
          description: 审计列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/approvals:
    get:
      tags: [approvals]
      summary: 审批列表
      description: 按 id 倒序返回待人工决策或历史审批；可按状态过滤。
      operationId: listApprovals
      parameters:
        - name: status
          in: query
          required: false
          description: 按审批状态过滤。
          schema:
            type: string
            enum: [pending, approved, rejected, timeout, cancelled]
        - name: limit
          in: query
          required: false
          description: 返回条数，默认 50；大于 200 时按 50 处理。
          schema:
            type: integer
            default: 50
            minimum: 1
      responses:
        "200":
          description: 审批列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/approvals/{id}/decide:
    parameters:
      - $ref: "#/components/parameters/ApprovalID"
    post:
      tags: [approvals]
      summary: 审批决策
      description: 批准或拒绝一条 pending 审批；已处理或不存在返回 409。
      operationId: decideApproval
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecideApprovalRequest"
      responses:
        "200":
          description: 决策后的审批
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Approval"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/missions/{id}/traffic:
    parameters:
      - $ref: "#/components/parameters/MissionID"
    get:
      tags: [missions]
      summary: 任务流量采集记录
      description: 按 id 倒序返回工具调用的两阶段采集记录，最多 200 条。
      operationId: listTraffic
      responses:
        "200":
          description: 采集记录列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrafficList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/traffic/{id}/evidence:
    parameters:
      - $ref: "#/components/parameters/TrafficID"
    post:
      tags: [evidence]
      summary: 把采集记录冻结为证据
      description: 只有 phase=result 的采集记录可以冻结；成功返回 201 与含签名的证据快照，未完成的采集返回 409。
      operationId: createEvidence
      responses:
        "201":
          description: 证据快照已创建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceSnapshot"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/evidence/{id}/verify:
    parameters:
      - $ref: "#/components/parameters/EvidenceID"
    get:
      tags: [evidence]
      summary: 校验证据完整性
      description: 重算快照签名并校验请求/响应正文的哈希；任一处被篡改返回 409 tampered。
      operationId: verifyEvidence
      responses:
        "200":
          description: 校验结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifyResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Tampered"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/system/update/check:
    get:
      tags: [update]
      summary: 检查新版本
      description: 查询 GitHub 最新 Release，比较版本并返回本平台资产信息；未配置自更新时返回 503 update_unavailable。
      operationId: updateCheck
      responses:
        "200":
          description: 检查结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateCheckResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/system/update/apply:
    post:
      tags: [update]
      summary: 下载并安装新版本
      description: 检查 → 下载本平台 zip → SHA256SUMS 校验 → --version 冒烟 → 备份 .old → 替换二进制；成功需重启生效，失败返回 409 update_failed。
      operationId: updateApply
      responses:
        "200":
          description: 安装结果（有更新或无更新）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateApplyResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/UpdateConflict"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/system/update/rollback:
    post:
      tags: [update]
      summary: 回滚到上一版本
      description: 用 <binary>.old 还原上一版本；无备份或回滚失败返回 409 rollback_failed，需重启生效。
      operationId: updateRollback
      responses:
        "200":
          description: 回滚结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RollbackResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/UpdateConflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/companies:
    get:
      tags: [companies]
      summary: 企业列表
      description: |
        按 id 升序返回当前租户的企业。`q` 对 name 与 slug 做模糊匹配（大小写不敏感，
        `%` 与 `_` 按字面量处理）；`limit` 缺省 50、上限 200。
      operationId: listCompanies
      parameters:
        - $ref: "#/components/parameters/LimitQuery"
        - $ref: "#/components/parameters/CompanySearchQuery"
      responses:
        "200":
          description: 企业列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"
    post:
      tags: [companies]
      summary: 创建企业
      description: name 与 slug 均为必填；同租户内 slug 重复返回 409。
      operationId: createCompany
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyCreateRequest"
      responses:
        "201":
          description: 企业已创建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/companies/{id}:
    parameters:
      - $ref: "#/components/parameters/CompanyID"
    get:
      tags: [companies]
      summary: 企业详情
      operationId: getCompany
      responses:
        "200":
          description: 企业详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
    patch:
      tags: [companies]
      summary: 更新企业
      description: 只更新传入且非空的字段；空对象按无变更（幂等）处理。slug 与其他企业重复返回 409。
      operationId: updateCompany
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyUpdateRequest"
      responses:
        "200":
          description: 更新后的企业
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
    delete:
      tags: [companies]
      summary: 删除企业
      description: 企业级资产范围随外键级联删除；返回 204。
      operationId: deleteCompany
      responses:
        "204":
          description: 已删除
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/companies/{id}/scope:
    parameters:
      - $ref: "#/components/parameters/CompanyID"
    get:
      tags: [companies]
      summary: 企业资产范围列表
      operationId: listCompanyScope
      responses:
        "200":
          description: 范围条目列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyScopeList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
    post:
      tags: [companies]
      summary: 新增企业资产范围
      description: |
        kind 必须是 root_domain/subdomain/ip/cidr/url/keyword/icp 之一；source 缺省
        manual，只允许 manual/import。同一企业下 (kind, value) 重复返回 409。
      operationId: addCompanyScope
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyScopeCreateRequest"
      responses:
        "201":
          description: 范围条目已创建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyScope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/companies/{id}/scope/{scope_id}:
    parameters:
      - $ref: "#/components/parameters/CompanyID"
      - $ref: "#/components/parameters/ScopeID"
    delete:
      tags: [companies]
      summary: 删除企业资产范围
      description: 条目必须属于路径中的企业，否则返回 404；成功返回 204。
      operationId: deleteCompanyScope
      responses:
        "204":
          description: 已删除
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/assets:
    get:
      tags: [assets]
      summary: 资产列表
      description: |
        `type` 精确过滤（root_domain/subdomain/ip/service/app/endpoint）；
        `q` 对 label 做模糊匹配（`%`/`_` 按字面量处理）；`limit` 缺省 50、上限 200。
        列表不返回身份键，需要身份键请查资产详情或 `/identities`。
      operationId: listAssets
      parameters:
        - $ref: "#/components/parameters/LimitQuery"
        - $ref: "#/components/parameters/AssetTypeQuery"
        - $ref: "#/components/parameters/AssetSearchQuery"
      responses:
        "200":
          description: 资产列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"
    post:
      tags: [assets]
      summary: 创建资产
      description: |
        带 `identities` 时按身份键 upsert：身份键命中已有资产则复用该资产并更新
        label/attrs（幂等），否则新建；不带 `identities` 时创建一条暂无身份键的裸资产。
        身份键会由领域层归一化（大小写、默认端口、结尾点、IPv6 压缩等），非法值返回 400。
      operationId: createAsset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssetCreateRequest"
      responses:
        "201":
          description: 资产已创建或已按身份键复用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/assets/{id}:
    parameters:
      - $ref: "#/components/parameters/AssetID"
    get:
      tags: [assets]
      summary: 资产详情
      description: 返回资产本身及其全部身份键。
      operationId: getAsset
      responses:
        "200":
          description: 资产详情（含 identities）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
    patch:
      tags: [assets]
      summary: 更新资产
      description: |
        label 与 attrs 传了才更新（attrs 整体替换）；parent_id 三种语义：
        字段缺省=不变，`null`=清空父资产，数字=设置为该父资产。
        父资产不存在、或把自身设为父资产返回 400。
      operationId: updateAsset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssetUpdateRequest"
      responses:
        "200":
          description: 更新后的资产（含 identities）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
    delete:
      tags: [assets]
      summary: 删除资产
      description: 身份键与任务资产关联随外键级联删除；子资产的 parent_id 会被置空；返回 204。
      operationId: deleteAsset
      responses:
        "204":
          description: 已删除
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/assets/{id}/identities:
    parameters:
      - $ref: "#/components/parameters/AssetID"
    get:
      tags: [assets]
      summary: 资产身份键列表
      operationId: listAssetIdentities
      responses:
        "200":
          description: 身份键列表（按 kind、key 升序）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetIdentityList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/missions/{id}/assets:
    parameters:
      - $ref: "#/components/parameters/MissionID"
    get:
      tags: [assets, missions]
      summary: 任务已登记资产
      description: 返回 mission_asset_links 关联的资产（不含身份键）；任务不存在返回 404。
      operationId: listMissionAssets
      responses:
        "200":
          description: 任务资产列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
    post:
      tags: [assets, missions]
      summary: 把资产登记到任务
      description: |
        source 缺省 manual，允许 manual/discovered/scope；同一资产重复登记返回 409；
        任务不存在返回 404；asset_id 引用的资产不存在返回 400。
      operationId: addMissionAsset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MissionAssetLinkRequest"
      responses:
        "201":
          description: 关联已创建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MissionAssetLink"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/missions/{id}/assets/{asset_id}:
    parameters:
      - $ref: "#/components/parameters/MissionID"
      - $ref: "#/components/parameters/AssetIDPath"
    delete:
      tags: [assets, missions]
      summary: 解除任务资产关联
      description: 关联不存在返回 404；成功返回 204。
      operationId: removeMissionAsset
      responses:
        "204":
          description: 已解除
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/missions/{id}/coverage:
    parameters:
      - $ref: "#/components/parameters/MissionID"
    get:
      tags: [assets, missions]
      summary: 任务资产覆盖度
      description: |
        分母 = 任务登记/范围解析的资产 ∪ role='target' 锚定资产；分子 = fact 节点上
        role='tested' 锚定的资产。任务没有资产时返回全零（`by_type` 为空数组），不报错。
      operationId: getMissionCoverage
      responses:
        "200":
          description: 覆盖度
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Coverage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 管理接口令牌；来自 auth.admin_token 或环境变量 BEACONX_ADMIN_TOKEN。
    tokenQuery:
      type: apiKey
      in: query
      name: token
      description: 与 Bearer 令牌相同；用于 EventSource 等无法自定义请求头的场景。
  parameters:
    MissionID:
      name: id
      in: path
      required: true
      description: 任务标识
      schema:
        type: integer
        format: int64
        minimum: 1
    ApprovalID:
      name: id
      in: path
      required: true
      description: 审批标识
      schema:
        type: integer
        format: int64
        minimum: 1
    TrafficID:
      name: id
      in: path
      required: true
      description: 采集记录标识
      schema:
        type: integer
        format: int64
        minimum: 1
    EvidenceID:
      name: id
      in: path
      required: true
      description: 证据快照标识
      schema:
        type: integer
        format: int64
        minimum: 1
    CompanyID:
      name: id
      in: path
      required: true
      description: 企业标识
      schema:
        type: integer
        format: int64
        minimum: 1
    ScopeID:
      name: scope_id
      in: path
      required: true
      description: 企业资产范围条目标识
      schema:
        type: integer
        format: int64
        minimum: 1
    AssetID:
      name: id
      in: path
      required: true
      description: 资产标识
      schema:
        type: integer
        format: int64
        minimum: 1
    AssetIDPath:
      name: asset_id
      in: path
      required: true
      description: 资产标识
      schema:
        type: integer
        format: int64
        minimum: 1
    LimitQuery:
      name: limit
      in: query
      required: false
      description: 返回条数上限，缺省 50，最大 200；非数字或非正数按缺省处理。
      schema:
        type: integer
        minimum: 1
        maximum: 200
    CompanySearchQuery:
      name: q
      in: query
      required: false
      description: 企业名称/slug 模糊搜索关键字（大小写不敏感）。
      schema:
        type: string
    AssetTypeQuery:
      name: type
      in: query
      required: false
      description: 资产类型精确过滤；非法取值返回 400。
      schema:
        $ref: "#/components/schemas/AssetType"
    AssetSearchQuery:
      name: q
      in: query
      required: false
      description: 资产标签模糊搜索关键字（大小写不敏感）。
      schema:
        type: string
  responses:
    BadRequest:
      description: 请求参数或请求体非法
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: 缺少令牌或令牌错误
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: 资源不存在（任务、企业、资产或关联）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: 任务当前状态不允许该操作
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Tampered:
      description: 证据校验失败，内容或签名可能已被篡改
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadGateway:
      description: 上游（GitHub API 或下载地址）访问失败
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UpdateConflict:
      description: 更新或回滚失败（校验和不匹配、冒烟失败、无备份等）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalError:
      description: 服务器内部错误
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unavailable:
      description: 任务运行时、事件流或自更新未就绪
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    MissionStatus:
      type: string
      description: 任务状态；终态为 done / failed / cancelled。
      enum:
        - queued
        - running
        - paused
        - finalizing
        - done
        - failed
        - cancelled
    Mission:
      type: object
      required: [tenant_id, id, name, goal, description, status, queued, reason, created_at, updated_at]
      properties:
        tenant_id:
          type: integer
          format: int64
        id:
          type: integer
          format: int64
        name:
          type: string
        goal:
          type: string
        description:
          type: string
        status:
          $ref: "#/components/schemas/MissionStatus"
        queued:
          type: boolean
          description: 是否在排队等待准入。
        queued_at:
          type: string
          format: date-time
          nullable: true
        started_at:
          type: string
          format: date-time
          nullable: true
        finished_at:
          type: string
          format: date-time
          nullable: true
        deadline_at:
          type: string
          format: date-time
          nullable: true
        reason:
          type: string
          description: 最近一次状态迁移的原因。
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        max_tokens:
          type: integer
          format: int64
          description: 任务的 token 预算；0 表示不限制。
        spent_tokens:
          type: integer
          format: int64
          description: 已累计消耗的 token 数。
        max_steps:
          type: integer
          description: 任务的步骤预算；0 表示不限制。
        steps_used:
          type: integer
          description: 已新增的计划步骤数。
    MissionList:
      type: object
      required: [missions]
      properties:
        missions:
          type: array
          items:
            $ref: "#/components/schemas/Mission"
    MissionCreateRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: 任务名称，不能为空。
        goal:
          type: string
        description:
          type: string
        max_tokens:
          type: integer
          format: int64
          default: 0
          description: 任务 token 预算；0 或不传表示不限制。
        max_steps:
          type: integer
          default: 0
          description: 任务步骤预算；0 或不传表示不限制。
    Approval:
      type: object
      required: [tenant_id, id, mission_id, node_id, tool, status, expires_at, created_at]
      properties:
        tenant_id:
          type: integer
          format: int64
        id:
          type: integer
          format: int64
        mission_id:
          type: integer
          format: int64
        node_id:
          type: integer
          format: int64
        tool:
          type: string
          description: 被审批的工具名。
        args:
          type: object
          additionalProperties: true
          description: 工具调用的原始参数（JSON 对象）。
        status:
          type: string
          description: 审批状态；只有 pending 可以被决策。
          enum: [pending, approved, rejected, timeout, cancelled]
        note:
          type: string
        decided_by:
          type: string
        decided_at:
          type: string
          format: date-time
          nullable: true
        expires_at:
          type: string
          format: date-time
          description: 审批过期时间。
        created_at:
          type: string
          format: date-time
    ApprovalList:
      type: object
      required: [approvals]
      properties:
        approvals:
          type: array
          items:
            $ref: "#/components/schemas/Approval"
    DecideApprovalRequest:
      type: object
      required: [approve]
      properties:
        approve:
          type: boolean
          description: true 表示批准，false 表示拒绝。
        note:
          type: string
          description: 决策备注，会写入审批记录。
    AuditEvent:
      type: object
      required: [tenant_id, id, mission_id, tool, action, rule_name, args_digest, outcome, detail, actor, created_at]
      properties:
        tenant_id:
          type: integer
          format: int64
        id:
          type: integer
          format: int64
        mission_id:
          type: integer
          format: int64
        node_id:
          type: integer
          format: int64
          nullable: true
          description: 触发工具调用的动作节点。
        tool:
          type: string
        action:
          type: string
          description: 策略裁决。
          enum: [allow, ask, deny]
        rule_name:
          type: string
          description: 命中的规则名；使用默认动作时为空。
        args_digest:
          type: string
          description: 工具参数原始 JSON 的 SHA-256 十六进制摘要。
        outcome:
          type: string
          description: 执行结果。
          enum: [executed, tool_error, denied_by_rule, rejected_by_user, approval_unavailable]
        detail:
          type: string
          description: 结果摘要或错误说明（可能被截断）。
        actor:
          type: string
        created_at:
          type: string
          format: date-time
    AuditList:
      type: object
      required: [audit]
      properties:
        audit:
          type: array
          items:
            $ref: "#/components/schemas/AuditEvent"
    TrafficExchange:
      type: object
      required: [tenant_id, id, mission_id, tool, phase, request_hash, request_size, response_hash, response_size, error, redaction, created_at]
      properties:
        tenant_id:
          type: integer
          format: int64
        id:
          type: integer
          format: int64
        mission_id:
          type: integer
          format: int64
        node_id:
          type: integer
          format: int64
          nullable: true
          description: 触发工具调用的动作节点。
        tool:
          type: string
        phase:
          type: string
          description: 采集阶段；intent 表示请求已登记，result 表示响应已写入。
          enum: [intent, result]
        request_hash:
          type: string
          description: 请求正文（脱敏后）的 SHA-256。
        request_size:
          type: integer
          format: int64
        response_hash:
          type: string
          description: 响应正文（脱敏后）的 SHA-256；未完成时为空。
        response_size:
          type: integer
          format: int64
        status_code:
          type: integer
          nullable: true
          description: 工具返回的 HTTP 状态码（http_probe）；其他工具为空。
        error:
          type: string
        redaction:
          type: string
          description: 采用的脱敏策略标记，例如 json-keys。
        created_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
          nullable: true
    TrafficList:
      type: object
      required: [traffic]
      properties:
        traffic:
          type: array
          items:
            $ref: "#/components/schemas/TrafficExchange"
    EvidenceSnapshot:
      type: object
      required: [tenant_id, id, mission_id, tool, request_hash, request_size, response_hash, response_size, signature, redaction, created_at]
      properties:
        tenant_id:
          type: integer
          format: int64
        id:
          type: integer
          format: int64
        mission_id:
          type: integer
          format: int64
        tool:
          type: string
        request_hash:
          type: string
        request_size:
          type: integer
          format: int64
        response_hash:
          type: string
        response_size:
          type: integer
          format: int64
        signature:
          type: string
          description: 对规范化元数据（含快照 ID）的 HMAC-SHA256。
        redaction:
          type: string
        created_at:
          type: string
          format: date-time
    VerifyResult:
      type: object
      required: [verified, evidence_id, signature]
      properties:
        verified:
          type: boolean
        evidence_id:
          type: integer
          format: int64
        signature:
          type: string
    ReleaseInfo:
      type: object
      required: [version, tag, url, published_at, asset_url, asset_name, checksum_url]
      properties:
        version:
          type: string
          description: 去掉 v 前缀的版本号。
        tag:
          type: string
          description: GitHub Release tag。
        url:
          type: string
          description: Release 页面地址。
        notes:
          type: string
          description: Release 说明（截断到 2000 字符）。
        published_at:
          type: string
          format: date-time
        asset_url:
          type: string
          description: 本平台发布包下载地址。
        asset_name:
          type: string
          description: 本平台发布包文件名。
        checksum_url:
          type: string
          description: SHA256SUMS 下载地址。
    UpdateCheckResult:
      type: object
      required: [has_update, release]
      properties:
        has_update:
          type: boolean
        release:
          $ref: "#/components/schemas/ReleaseInfo"
    UpdateApplyResult:
      type: object
      required: [updated, version, message]
      properties:
        updated:
          type: boolean
          description: 是否实际安装了新版本。
        version:
          type: string
        message:
          type: string
          description: 面向人的结果说明（成功需重启生效）。
    RollbackResult:
      type: object
      required: [rolled_back, message]
      properties:
        rolled_back:
          type: boolean
        message:
          type: string
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: 机器可读错误码，例如 bad_request / not_found / conflict / unauthorized / runtime_unavailable / sse_unavailable / replay_failed / internal_error。
            message:
              type: string
              description: 人类可读错误信息。
            request_id:
              type: string
              description: 请求标识，便于与服务端日志关联。
    Readiness:
      type: object
      required: [ready, checks]
      properties:
        ready:
          type: boolean
        checks:
          type: array
          items:
            type: object
            required: [name, ok]
            properties:
              name:
                type: string
              ok:
                type: boolean
              error:
                type: string
    SystemInfo:
      type: object
      properties:
        service:
          type: string
        version:
          type: string
        commit:
          type: string
        build_time:
          type: string
        started_at:
          type: string
          format: date-time
        uptime:
          type: string
        schema_version:
          type: integer
          format: int64
        latest_migration:
          type: integer
          format: int64
    AssetType:
      type: string
      description: 资产类型。
      enum: [root_domain, subdomain, ip, service, app, endpoint]
    Company:
      type: object
      required: [tenant_id, id, name, slug, created_at, updated_at]
      properties:
        tenant_id:
          type: integer
          format: int64
          description: 所属租户。
        id:
          type: integer
          format: int64
        name:
          type: string
          description: 企业名称。
        slug:
          type: string
          description: 同租户内唯一的企业短标识。
        attrs:
          type: object
          additionalProperties: true
          description: 扩展属性，默认空对象。
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CompanyList:
      type: object
      required: [companies]
      properties:
        companies:
          type: array
          items:
            $ref: "#/components/schemas/Company"
    CompanyCreateRequest:
      type: object
      required: [name, slug]
      properties:
        name:
          type: string
          description: 企业名称，不能为空（首尾空白会被去除）。
        slug:
          type: string
          description: 企业短标识，同租户内唯一，冲突返回 409。
    CompanyUpdateRequest:
      type: object
      properties:
        name:
          type: string
          description: 新名称；空串表示不修改。
        slug:
          type: string
          description: 新短标识；空串表示不修改，冲突返回 409。
    CompanyScope:
      type: object
      required: [tenant_id, id, company_id, kind, value, source, created_at]
      properties:
        tenant_id:
          type: integer
          format: int64
        id:
          type: integer
          format: int64
        company_id:
          type: integer
          format: int64
        kind:
          type: string
          description: 范围类型。
          enum: [root_domain, subdomain, ip, cidr, url, keyword, icp]
        value:
          type: string
          description: 范围值（按 kind 解释：域名、IP、CIDR、URL 或关键词）。
        source:
          type: string
          description: 来源；企业范围只允许 manual（人工）/import（导入）。
          enum: [manual, import]
        created_at:
          type: string
          format: date-time
    CompanyScopeList:
      type: object
      required: [scope]
      properties:
        scope:
          type: array
          items:
            $ref: "#/components/schemas/CompanyScope"
    CompanyScopeCreateRequest:
      type: object
      required: [kind, value]
      properties:
        kind:
          type: string
          description: 范围类型白名单同 CompanyScope.kind。
          enum: [root_domain, subdomain, ip, cidr, url, keyword, icp]
        value:
          type: string
          description: 范围值，不能为空（首尾空白会被去除）。
        source:
          type: string
          description: 来源，缺省 manual。
          enum: [manual, import]
    AssetIdentity:
      type: object
      required: [tenant_id, asset_id, kind, key, created_at]
      properties:
        tenant_id:
          type: integer
          format: int64
        asset_id:
          type: integer
          format: int64
        kind:
          $ref: "#/components/schemas/AssetType"
        key:
          type: string
          description: 归一化后的身份键（例如小写域名、压缩 IPv6、已去默认端口的 URL）。
        created_at:
          type: string
          format: date-time
    AssetIdentityList:
      type: object
      required: [identities]
      properties:
        identities:
          type: array
          items:
            $ref: "#/components/schemas/AssetIdentity"
    Asset:
      type: object
      required: [tenant_id, id, type, label, created_at, updated_at]
      properties:
        tenant_id:
          type: integer
          format: int64
        id:
          type: integer
          format: int64
        type:
          $ref: "#/components/schemas/AssetType"
        label:
          type: string
          description: 资产的可读标签（域名、IP、URL、应用名等）。
        parent_id:
          type: integer
          format: int64
          nullable: true
          description: 父资产标识；无父资产时省略。
        attrs:
          type: object
          additionalProperties: true
          description: 扩展属性，默认空对象。
        identities:
          type: array
          description: 身份键；列表接口不返回，详情/创建/更新接口返回。
          items:
            $ref: "#/components/schemas/AssetIdentity"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    AssetList:
      type: object
      required: [assets]
      properties:
        assets:
          type: array
          items:
            $ref: "#/components/schemas/Asset"
    AssetCreateRequest:
      type: object
      required: [type, label]
      properties:
        type:
          $ref: "#/components/schemas/AssetType"
        label:
          type: string
          description: 资产标签，不能为空。
        parent_id:
          type: integer
          format: int64
          nullable: true
          description: 父资产标识；必须存在且属于当前租户。
        attrs:
          type: object
          additionalProperties: true
        identities:
          type: array
          description: 身份键；提供时走 upsert 语义，省略时创建裸资产。
          items:
            type: object
            required: [kind, key]
            properties:
              kind:
                $ref: "#/components/schemas/AssetType"
              key:
                type: string
                description: 原始身份值，服务端会归一化后入库。
    AssetUpdateRequest:
      type: object
      properties:
        label:
          type: string
          description: 新标签；不能为空串。
        parent_id:
          type: integer
          format: int64
          nullable: true
          description: 缺省=不变；null=清空父资产；数字=设置为该父资产。
        attrs:
          type: object
          additionalProperties: true
          description: 传了则整体替换属性对象。
    MissionAssetLink:
      type: object
      required: [mission_id, asset_id, source]
      properties:
        mission_id:
          type: integer
          format: int64
        asset_id:
          type: integer
          format: int64
        source:
          type: string
          description: 资产进入任务的路径。
          enum: [scope, discovered, manual]
    MissionAssetLinkRequest:
      type: object
      required: [asset_id]
      properties:
        asset_id:
          type: integer
          format: int64
          description: 要登记到任务的资产标识；资产不存在返回 400。
        source:
          type: string
          description: 关联来源，缺省 manual。
          enum: [scope, discovered, manual]
    Coverage:
      type: object
      required: [total, tested, percent, by_type]
      properties:
        total:
          type: integer
          description: 覆盖度分母：登记/范围内资产的去重总数。
        tested:
          type: integer
          description: 覆盖度分子：被 fact 节点以 role=tested 锚定过的资产数。
        percent:
          type: number
          format: double
          description: tested/total 的百分比；total=0 时为 0。
        by_type:
          type: array
          items:
            type: object
            required: [type, total, tested, percent]
            properties:
              type:
                $ref: "#/components/schemas/AssetType"
              total:
                type: integer
              tested:
                type: integer
              percent:
                type: number
                format: double
