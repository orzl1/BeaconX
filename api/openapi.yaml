openapi: 3.0.3
info:
  title: BeaconX API
  version: 0.4.0
  description: |
    BeaconX M4 HTTP API：系统探针、任务生命周期管理（含 AI 规划预算与工具调用审计）、
    工具审批与 SSE 事件流。
    接口统一在 /api/v1 下版本管理；本文档是生成客户端的唯一来源，
    与 internal/httpapi 中的声明式路由表同步演进。
servers:
  - url: http://127.0.0.1:6969
security:
  - bearerAuth: []
tags:
  - name: system
    description: 系统探针与元信息（公开端点）
  - name: missions
    description: 任务生命周期管理（需要令牌）
  - name: events
    description: 任务事件流（需要令牌，SSE 也可用查询参数）
  - name: approvals
    description: 工具调用的审批列表与决策（需要令牌）
paths:
  /healthz:
    get:
      tags: [system]
      summary: 存活探针
      operationId: healthz
      security: []
      responses:
        "200":
          description: 进程存活
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: ok
  /readyz:
    get:
      tags: [system]
      summary: 就绪探针
      operationId: readyz
      security: []
      responses:
        "200":
          description: 已就绪，可以对外提供服务
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
        "503":
          description: 未就绪（依赖不可用或迁移尚未应用）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
  /api/v1/system/info:
    get:
      tags: [system]
      summary: 构建与 schema 信息
      operationId: systemInfo
      security: []
      responses:
        "200":
          description: 服务信息
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemInfo"
  /api/v1/system/tenant:
    get:
      tags: [system]
      summary: 本次请求解析到的租户
      operationId: systemTenant
      security: []
      responses:
        "200":
          description: 租户标识
          content:
            application/json:
              schema:
                type: object
                required: [tenant_id]
                properties:
                  tenant_id:
                    type: integer
                    format: int64
  /api/v1/missions:
    post:
      tags: [missions]
      summary: 创建任务
      description: 创建后任务进入 queued，由准入调度按 FIFO 启动。
      operationId: createMission
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MissionCreateRequest"
      responses:
        "201":
          description: 任务已创建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Mission"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"
    get:
      tags: [missions]
      summary: 任务列表
      operationId: listMissions
      parameters:
        - name: status
          in: query
          required: false
          description: 按任务状态过滤；省略时返回全部状态。
          schema:
            $ref: "#/components/schemas/MissionStatus"
        - name: limit
          in: query
          required: false
          description: 返回条数，默认 50，最大 200（超出按 200 截断）。
          schema:
            type: integer
            default: 50
            minimum: 1
      responses:
        "200":
          description: 任务列表（按 id 倒序）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MissionList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/missions/{id}:
    parameters:
      - $ref: "#/components/parameters/MissionID"
    get:
      tags: [missions]
      summary: 任务详情
      operationId: getMission
      responses:
        "200":
          description: 任务详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Mission"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [missions]
      summary: 删除任务
      description: 级联删除任务的事件、节点、边、锚点、范围与资产链接，返回 204。
      operationId: deleteMission
      responses:
        "204":
          description: 已删除
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/missions/{id}/pause:
    parameters:
      - $ref: "#/components/parameters/MissionID"
    post:
      tags: [missions]
      summary: 暂停任务
      description: 仅运行中的任务可暂停；暂停后释放动作租约，可用 resume 恢复。
      operationId: pauseMission
      responses:
        "200":
          description: 暂停后的任务
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Mission"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/missions/{id}/resume:
    parameters:
      - $ref: "#/components/parameters/MissionID"
    post:
      tags: [missions]
      summary: 恢复任务
      description: 只有已暂停的任务可恢复；恢复后回到 queued，等待重新准入。
      operationId: resumeMission
      responses:
        "200":
          description: 恢复后的任务
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Mission"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/missions/{id}/cancel:
    parameters:
      - $ref: "#/components/parameters/MissionID"
    post:
      tags: [missions]
      summary: 取消任务
      description: 排队中、运行中、已暂停或收尾中的任务均可取消；结束后进入 cancelled 终态。
      operationId: cancelMission
      responses:
        "200":
          description: 取消后的任务
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Mission"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/missions/{id}/events:
    parameters:
      - $ref: "#/components/parameters/MissionID"
    get:
      tags: [events]
      summary: 任务事件流（SSE）
      description: |
        以 Server-Sent Events 推送任务事件。处理顺序为先订阅内存总线、再回放
        mission_events，最后转发实时事件；回放按事件 id 升序，实时事件按 id 去重。

        游标优先取 Last-Event-ID 请求头，其次取 ?since= 查询参数；空值、非法值
        与负数按 0 处理。单次回放上限 500 条，心跳为注释行 `: ping`（默认 20s）。

        帧格式：
        `id: <事件 id>` / `event: <事件类型>` / `data: <JSON>`，以空行结束。

        令牌可用 Authorization: Bearer，也可用 ?token= 查询参数携带（EventSource 无法自定义请求头）。
      operationId: missionEvents
      security:
        - bearerAuth: []
        - tokenQuery: []
      parameters:
        - name: Last-Event-ID
          in: header
          required: false
          description: 客户端已有的事件 id 游标；浏览器 EventSource 断线重连时自动携带。
          schema:
            type: string
        - name: since
          in: query
          required: false
          description: 事件 id 游标；仅在缺少 Last-Event-ID 时使用。
          schema:
            type: integer
            format: int64
            default: 0
      responses:
        "200":
          description: SSE 事件流
          content:
            text/event-stream:
              schema:
                type: string
                description: SSE 帧序列（id / event / data 行，空行分隔；心跳为注释行）。
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/missions/{id}/audit:
    parameters:
      - $ref: "#/components/parameters/MissionID"
    get:
      tags: [missions]
      summary: 任务工具调用审计
      description: 返回任务下每次工具调用的策略裁决与执行结果，按 id 倒序，最多 200 条。
      operationId: missionAudit
      responses:
        "200":
          description: 审计列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/approvals:
    get:
      tags: [approvals]
      summary: 审批列表
      description: 按 id 倒序返回待人工决策或历史审批；可按状态过滤。
      operationId: listApprovals
      parameters:
        - name: status
          in: query
          required: false
          description: 按审批状态过滤。
          schema:
            type: string
            enum: [pending, approved, rejected, timeout, cancelled]
        - name: limit
          in: query
          required: false
          description: 返回条数，默认 50；大于 200 时按 50 处理。
          schema:
            type: integer
            default: 50
            minimum: 1
      responses:
        "200":
          description: 审批列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/approvals/{id}/decide:
    parameters:
      - $ref: "#/components/parameters/ApprovalID"
    post:
      tags: [approvals]
      summary: 审批决策
      description: 批准或拒绝一条 pending 审批；已处理或不存在返回 409。
      operationId: decideApproval
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecideApprovalRequest"
      responses:
        "200":
          description: 决策后的审批
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Approval"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 管理接口令牌；来自 auth.admin_token 或环境变量 BEACONX_ADMIN_TOKEN。
    tokenQuery:
      type: apiKey
      in: query
      name: token
      description: 与 Bearer 令牌相同；用于 EventSource 等无法自定义请求头的场景。
  parameters:
    MissionID:
      name: id
      in: path
      required: true
      description: 任务标识
      schema:
        type: integer
        format: int64
        minimum: 1
    ApprovalID:
      name: id
      in: path
      required: true
      description: 审批标识
      schema:
        type: integer
        format: int64
        minimum: 1
  responses:
    BadRequest:
      description: 请求参数或请求体非法
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: 缺少令牌或令牌错误
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: 任务不存在
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: 任务当前状态不允许该操作
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalError:
      description: 服务器内部错误
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unavailable:
      description: 任务运行时或事件流未就绪
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    MissionStatus:
      type: string
      description: 任务状态；终态为 done / failed / cancelled。
      enum:
        - queued
        - running
        - paused
        - finalizing
        - done
        - failed
        - cancelled
    Mission:
      type: object
      required: [tenant_id, id, name, goal, description, status, queued, reason, created_at, updated_at]
      properties:
        tenant_id:
          type: integer
          format: int64
        id:
          type: integer
          format: int64
        name:
          type: string
        goal:
          type: string
        description:
          type: string
        status:
          $ref: "#/components/schemas/MissionStatus"
        queued:
          type: boolean
          description: 是否在排队等待准入。
        queued_at:
          type: string
          format: date-time
          nullable: true
        started_at:
          type: string
          format: date-time
          nullable: true
        finished_at:
          type: string
          format: date-time
          nullable: true
        deadline_at:
          type: string
          format: date-time
          nullable: true
        reason:
          type: string
          description: 最近一次状态迁移的原因。
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        max_tokens:
          type: integer
          format: int64
          description: 任务的 token 预算；0 表示不限制。
        spent_tokens:
          type: integer
          format: int64
          description: 已累计消耗的 token 数。
        max_steps:
          type: integer
          description: 任务的步骤预算；0 表示不限制。
        steps_used:
          type: integer
          description: 已新增的计划步骤数。
    MissionList:
      type: object
      required: [missions]
      properties:
        missions:
          type: array
          items:
            $ref: "#/components/schemas/Mission"
    MissionCreateRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: 任务名称，不能为空。
        goal:
          type: string
        description:
          type: string
        max_tokens:
          type: integer
          format: int64
          default: 0
          description: 任务 token 预算；0 或不传表示不限制。
        max_steps:
          type: integer
          default: 0
          description: 任务步骤预算；0 或不传表示不限制。
    Approval:
      type: object
      required: [tenant_id, id, mission_id, node_id, tool, status, expires_at, created_at]
      properties:
        tenant_id:
          type: integer
          format: int64
        id:
          type: integer
          format: int64
        mission_id:
          type: integer
          format: int64
        node_id:
          type: integer
          format: int64
        tool:
          type: string
          description: 被审批的工具名。
        args:
          type: object
          additionalProperties: true
          description: 工具调用的原始参数（JSON 对象）。
        status:
          type: string
          description: 审批状态；只有 pending 可以被决策。
          enum: [pending, approved, rejected, timeout, cancelled]
        note:
          type: string
        decided_by:
          type: string
        decided_at:
          type: string
          format: date-time
          nullable: true
        expires_at:
          type: string
          format: date-time
          description: 审批过期时间。
        created_at:
          type: string
          format: date-time
    ApprovalList:
      type: object
      required: [approvals]
      properties:
        approvals:
          type: array
          items:
            $ref: "#/components/schemas/Approval"
    DecideApprovalRequest:
      type: object
      required: [approve]
      properties:
        approve:
          type: boolean
          description: true 表示批准，false 表示拒绝。
        note:
          type: string
          description: 决策备注，会写入审批记录。
    AuditEvent:
      type: object
      required: [tenant_id, id, mission_id, tool, action, rule_name, args_digest, outcome, detail, actor, created_at]
      properties:
        tenant_id:
          type: integer
          format: int64
        id:
          type: integer
          format: int64
        mission_id:
          type: integer
          format: int64
        node_id:
          type: integer
          format: int64
          nullable: true
          description: 触发工具调用的动作节点。
        tool:
          type: string
        action:
          type: string
          description: 策略裁决。
          enum: [allow, ask, deny]
        rule_name:
          type: string
          description: 命中的规则名；使用默认动作时为空。
        args_digest:
          type: string
          description: 工具参数原始 JSON 的 SHA-256 十六进制摘要。
        outcome:
          type: string
          description: 执行结果。
          enum: [executed, tool_error, denied_by_rule, rejected_by_user, approval_unavailable]
        detail:
          type: string
          description: 结果摘要或错误说明（可能被截断）。
        actor:
          type: string
        created_at:
          type: string
          format: date-time
    AuditList:
      type: object
      required: [audit]
      properties:
        audit:
          type: array
          items:
            $ref: "#/components/schemas/AuditEvent"
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: 机器可读错误码，例如 bad_request / not_found / conflict / unauthorized / runtime_unavailable / sse_unavailable / replay_failed / internal_error。
            message:
              type: string
              description: 人类可读错误信息。
            request_id:
              type: string
              description: 请求标识，便于与服务端日志关联。
    Readiness:
      type: object
      required: [ready, checks]
      properties:
        ready:
          type: boolean
        checks:
          type: array
          items:
            type: object
            required: [name, ok]
            properties:
              name:
                type: string
              ok:
                type: boolean
              error:
                type: string
    SystemInfo:
      type: object
      properties:
        service:
          type: string
        version:
          type: string
        commit:
          type: string
        build_time:
          type: string
        started_at:
          type: string
          format: date-time
        uptime:
          type: string
        schema_version:
          type: integer
          format: int64
        latest_migration:
          type: integer
          format: int64
