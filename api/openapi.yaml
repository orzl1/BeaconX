                $ref: "#/components/schemas/MissionScopeList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
    post:
      tags: [missions, graph]
      summary: 新增任务范围
      description: |
        kind 必须是 root_domain/subdomain/ip/cidr/url/keyword 之一（与数据库 CHECK 一致）；
        (kind, value) 重复返回 409；任务不存在返回 404。
      operationId: addMissionScope
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MissionScopeCreateRequest"
      responses:
        "201":
          description: 任务范围条目已创建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MissionScopeEntry"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
