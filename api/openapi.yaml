openapi: 3.0.3
info:
  title: BeaconX API
  version: 0.1.0
  description: |
    M0 里程碑的 HTTP 接口骨架。接口统一在 /api/v1 下做版本管理。
    本文档是生成客户端的唯一来源，与 internal/httpapi 中的声明式路由表
    同步演进。
servers:
  - url: http://127.0.0.1:6969
paths:
  /healthz:
    get:
      summary: 存活探针
      operationId: healthz
      responses:
        "200":
          description: 进程存活
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: ok
  /readyz:
    get:
      summary: 就绪探针
      operationId: readyz
      responses:
        "200":
          description: 已就绪，可以对外提供服务
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
        "503":
          description: 未就绪（依赖不可用或迁移尚未应用）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
  /api/v1/system/info:
    get:
      summary: 构建与 schema 信息
      operationId: systemInfo
      responses:
        "200":
          description: 服务信息
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemInfo"
  /api/v1/system/tenant:
    get:
      summary: 本次请求解析到的租户
      operationId: systemTenant
      responses:
        "200":
          description: 租户标识
          content:
            application/json:
              schema:
                type: object
                required: [tenant_id]
                properties:
                  tenant_id:
                    type: integer
                    format: int64
components:
  schemas:
    Readiness:
      type: object
      required: [ready, checks]
      properties:
        ready:
          type: boolean
        checks:
          type: array
          items:
            type: object
            required: [name, ok]
            properties:
              name:
                type: string
              ok:
                type: boolean
              error:
                type: string
    SystemInfo:
      type: object
      properties:
        service:
          type: string
        version:
          type: string
        commit:
          type: string
        build_time:
          type: string
        started_at:
          type: string
          format: date-time
        uptime:
          type: string
        schema_version:
          type: integer
          format: int64
        latest_migration:
          type: integer
          format: int64
