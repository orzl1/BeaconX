      - $ref: "#/components/parameters/MissionID"
      - $ref: "#/components/parameters/MissionScopeID"
    delete:
      tags: [missions, graph]
      summary: 删除任务范围
      description: 条目必须属于路径中的任务，否则返回 404；成功返回 204。
      operationId: deleteMissionScope
      responses:
        "204":
          description: 已删除
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/missions/{id}/plan:
    parameters:
      - $ref: "#/components/parameters/MissionID"
    get:
      tags: [missions, graph]
      summary: 任务计划步骤
      description: |
        返回任务的计划步骤（含 depends_on/status/priority），空计划返回 `[]`；
        任务不存在返回 404。
      operationId: getMissionPlan
      responses:
        "200":
          description: 计划步骤列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanStepList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/missions/{id}/graph:
    parameters:
      - $ref: "#/components/parameters/MissionID"
      - $ref: "#/components/parameters/GraphKindQuery"
      - $ref: "#/components/parameters/GraphStateQuery"
      - $ref: "#/components/parameters/GraphLimitQuery"
      - name: after_id
        in: query
        required: false
        description: 节点游标；取 id > after_id（升序），响应 next_after_id；edges/anchors 仍全量。
        schema:
          type: integer
          format: int64
          minimum: 0
    get:
      tags: [missions, graph]
      summary: 任务作战图
      description: |
        一次性返回任务的节点、边与锚点；`kind`/`state` 过滤只作用于节点
        （边与锚点返回该任务全量，按 id 排序）。非法 kind/state 返回 400；
        limit 缺省 500、上限 2000；支持 `after_id`/`next_after_id`（节点升序 id>）；空数组返回 `[]`。任务不存在返回 404。
      operationId: getMissionGraph
      responses:
        "200":
          description: 作战图视图
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GraphView"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/nodes/{id}:
    parameters:
      - $ref: "#/components/parameters/NodeID"
    get:
      tags: [graph]
      summary: 作战图节点详情
      description: 返回节点本身（含 payload）；节点不存在返回 404。
      operationId: getOperationNode
      responses:
        "200":
          description: 节点详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationNode"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/nodes/{id}/state:
    parameters:
      - $ref: "#/components/parameters/NodeID"
    patch:
      tags: [graph]
      summary: 更新作战图节点状态
      description: |
        state 只允许 open/running/done/exhausted/blocked；节点类型规则由领域层校验
        （例如事实/发现/提示/摘要等知识类节点不允许 running，目标不允许 running/exhausted），
        非法迁移返回 400。成功返回更新后的节点。
      operationId: updateOperationNodeState
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NodeStatePatchRequest"
      responses:
        "200":
          description: 更新后的节点
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationNode"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/missions/{id}/findings:
    parameters:
      - $ref: "#/components/parameters/MissionID"
    get:
      tags: [missions, findings]
      summary: 发现列表
      description: |
        按创建时间倒序返回任务的发现；支持 ?severity= 与 ?status= 过滤（非法取值返回 400），
        ?limit= 缺省 50、上限 200。空列表返回 `{"findings":[]}`。任务不存在返回 404。
      operationId: listFindings
      parameters:
        - name: severity
          in: query
          required: false
          description: 严重级别过滤。
          schema:
            $ref: "#/components/schemas/Severity"
        - name: status
          in: query
          required: false
          description: 处置状态过滤。
          schema:
            $ref: "#/components/schemas/FindingStatus"
        - name: limit
          in: query
          required: false
          description: 返回条数上限，缺省 50、上限 200；超出或非正数按缺省处理。
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: 发现列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FindingList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
    post:
      tags: [missions, findings]
      summary: 创建发现
      description: |
        创建一条发现，初始 status=open、severity 缺省 info；title 必填。
        asset_id/node_id 可选，必须存在且属于同一租户（节点还要求同一任务），否则 400。
      operationId: createFinding
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FindingCreateRequest"
      responses:
        "201":
          description: 已创建的发现
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Finding"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/findings/{id}:
    parameters:
      - $ref: "#/components/parameters/FindingID"
    get:
      tags: [findings]
      summary: 发现详情
      description: 返回发现字段平铺 + `evidence:[]`（已绑定的证据快照列表）。
      operationId: getFinding
      responses:
        "200":
          description: 发现详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FindingDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
    patch:
      tags: [findings]
      summary: 更新发现
      description: |
        局部更新 title/severity/detail/asset_id。asset_id 三态：字段缺省=不变、
        JSON null=清空、正整数=设置；资产不存在返回 400。
      operationId: updateFinding
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FindingUpdate"
      responses:
        "200":
          description: 更新后的发现
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Finding"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/findings/{id}/status:
    parameters:
      - $ref: "#/components/parameters/FindingID"
    post:
      tags: [findings]
      summary: 发现状态流转
      description: |
        按发现状态机迁移：open→confirmed/false_positive/closed、confirmed→fixed/retest/closed、
        retest→confirmed/fixed/closed、fixed→retest/closed；closed/false_positive 终态，
        同状态不算迁移。非法迁移返回 409，status 取值非法返回 400。
      operationId: transitionFinding
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FindingStatusRequest"
      responses:
        "200":
          description: 迁移后的发现
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Finding"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/findings/{id}/evidence:
    parameters:
      - $ref: "#/components/parameters/FindingID"
    get:
      tags: [findings, evidence]
      summary: 发现关联证据
      description: 列出发现已绑定的证据快照（按绑定时间、快照 id 升序）；空列表返回 `[]`。
      operationId: listFindingEvidence
      responses:
        "200":
          description: 证据绑定列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FindingEvidenceList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
    post:
      tags: [findings, evidence]
      summary: 绑定证据到发现
      description: |
        快照必须存在、同租户且属于发现所在任务（否则 400）；重复绑定返回 409。
        成功返回 201 与绑定视图。
      operationId: addFindingEvidence
      requestBody:
        required: true
        content:
          application/json:
