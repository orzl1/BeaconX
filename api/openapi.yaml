      tags: [skills]
      summary: 创建技能元数据
      description: |
        创建技能元数据。
      operationId: createSkill
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SkillCreateRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Skill"

  /api/v1/skills/{name}:
    parameters:
      - name: name
        in: path
        required: true
        description: 名称
        schema:
          type: string
    get:
      tags: [skills]
      summary: 技能详情
      description: |
        技能详情。
      operationId: getSkill
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Skill"
    patch:
      tags: [skills]
      summary: 更新技能元数据
      description: |
        更新技能元数据。
      operationId: patchSkill
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SkillPatchRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Skill"
    delete:
      tags: [skills]
      summary: 删除技能（含磁盘文件）
      description: |
        删除技能（含磁盘文件）。
      operationId: deleteSkill
      responses:
        "200":
          description: OK
          description: 无内容

  /api/v1/skills/upload:
    post:
      tags: [skills]
      summary: 上传技能 zip（≤10MB/≤200 文件/仅文本）
      description: |
        上传技能 zip（≤10MB/≤200 文件/仅文本）。
      operationId: uploadSkill
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Skill"

  /api/v1/skills/{name}/files:
    parameters:
      - name: name
        in: path
        required: true
        description: 名称
        schema:
          type: string
    get:
      tags: [skills]
      summary: 技能文件树
      description: |
        技能文件树。
      operationId: listSkillFiles
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillFileList"

  /api/v1/skills/{name}/files/{path}:
    parameters:
      - name: name
        in: path
        required: true
        description: 名称
        schema:
          type: string
      - name: path
        in: path
        required: true
        description: 文件相对路径
        schema:
          type: string
    get:
      tags: [skills]
      summary: 读取技能文本文件（≤1MB）
      description: |
        读取技能文本文件（≤1MB）。
      operationId: readSkillFile
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillFileContent"
    put:
      tags: [skills]
      summary: 写入技能文本文件
      description: |
        写入技能文本文件。
      operationId: writeSkillFile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SkillWriteRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillFileContent"
    delete:
      tags: [skills]
      summary: 删除技能文件
      description: |
        删除技能文件。
      operationId: deleteSkillFile
      responses:
        "200":
          description: OK
          description: 无内容
  /api/v1/activity:
    get:
      tags: [insights, activity]
      summary: 全局活动流
      description: |
        mission_events 跨任务倒序；支持 before_id 游标、mission_id/type 过滤；
        limit 缺省 50、上限 200；不存在的 mission_id 返回空数组。
      operationId: listActivity
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
        - name: before_id
          in: query
          required: false
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: mission_id
          in: query
          required: false
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: type
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: 活动流
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/skills/{name}/versions:
    parameters:
      - name: name
        in: path
        required: true
        description: 技能名
        schema:
          type: string
    get:
      tags: [skills]
      summary: 技能版本历史
      description: 版本快照（.versions/<timestamp>/），保留最近 5 份，timestamp 降序；技能不存在 404。
      operationId: listSkillVersions
      responses:
        "200":
          description: 版本列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillVersionList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/skills/{name}/versions/{timestamp}/restore:
    parameters:
      - name: name
        in: path
        required: true
        description: 技能名
        schema:
          type: string
      - name: timestamp
        in: path
        required: true
        description: 版本时间戳（YYYYMMDDTHHMMSS.<nanos>）
        schema:
          type: string
    post:
      tags: [skills]
      summary: 恢复技能到指定版本
      description: 先把当前状态打快照，再恢复指定版本的文件内容；不回滚 DB 元数据（🟡）。
      operationId: restoreSkillVersion
      responses:
        "200":
          description: 恢复后的技能视图
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillRestore"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 管理接口令牌；来自 auth.admin_token 或环境变量 BEACONX_ADMIN_TOKEN。
    tokenQuery:
      type: apiKey
      in: query
      name: token
      description: 与 Bearer 令牌相同；用于 EventSource 等无法自定义请求头的场景。
  parameters:
    MissionID:
      name: id
      in: path
      required: true
      description: 任务标识
      schema:
        type: integer
        format: int64
        minimum: 1
    ApprovalID:
      name: id
      in: path
      required: true
      description: 审批标识
      schema:
        type: integer
        format: int64
        minimum: 1
    TrafficID:
      name: id
      in: path
      required: true
      description: 采集记录标识
      schema:
        type: integer
        format: int64
        minimum: 1
    AuditEventID:
      name: id
      in: path
      required: true
      description: 命令执行记录（audit_events）标识
      schema:
        type: integer
        format: int64
        minimum: 1
    EvidenceID:
      name: id
      in: path
      required: true
      description: 证据快照标识
      schema:
        type: integer
        format: int64
        minimum: 1
    CompanyID:
      name: id
      in: path
      required: true
      description: 企业标识
      schema:
        type: integer
        format: int64
        minimum: 1
    ScopeID:
      name: scope_id
      in: path
      required: true
      description: 企业资产范围条目标识
      schema:
        type: integer
        format: int64
        minimum: 1
    AssetID:
      name: id
      in: path
      required: true
      description: 资产标识
      schema:
        type: integer
        format: int64
        minimum: 1
    AssetIDPath:
      name: asset_id
      in: path
      required: true
      description: 资产标识
      schema:
        type: integer
        format: int64
        minimum: 1
    LimitQuery:
      name: limit
      in: query
      required: false
      description: 返回条数上限，缺省 50，最大 200；非数字或非正数按缺省处理。
      schema:
        type: integer
        minimum: 1
        maximum: 200
    CompanySearchQuery:
      name: q
      in: query
      required: false
      description: 企业名称/slug 模糊搜索关键字（大小写不敏感）。
      schema:
        type: string
    AssetTypeQuery:
      name: type
      in: query
      required: false
      description: 资产类型精确过滤；非法取值返回 400。
      schema:
        $ref: "#/components/schemas/AssetType"
    AssetSearchQuery:
      name: q
      in: query
      required: false
      description: 资产标签模糊搜索关键字（大小写不敏感）。
      schema:
        type: string
    MissionScopeID:
      name: scope_id
      in: path
      required: true
      description: 任务范围条目标识
      schema:
        type: integer
        format: int64
        minimum: 1
    NodeID:
      name: id
      in: path
      required: true
      description: 作战图节点标识
      schema:
        type: integer
        format: int64
        minimum: 1
    GraphKindQuery:
      name: kind
      in: query
      required: false
      description: 按节点类型过滤；非法取值返回 400。
      schema:
        $ref: "#/components/schemas/NodeKind"
    GraphStateQuery:
      name: state
      in: query
      required: false
      description: 按节点状态过滤；非法取值返回 400。
      schema:
        $ref: "#/components/schemas/NodeState"
    GraphLimitQuery:
      name: limit
      in: query
      required: false
      description: 节点返回条数上限，缺省 500，最大 2000；非数字或非正数按缺省处理。
      schema:
        type: integer
        minimum: 1
        maximum: 2000
    FindingID:
      name: id
      in: path
      required: true
      description: 发现标识
      schema:
        type: integer
        format: int64
        minimum: 1
    RetestID:
      name: id
      in: path
      required: true
      description: 复测标识
      schema:
        type: integer
        format: int64
        minimum: 1
    SnapshotID:
      name: snapshot_id
      in: path
      required: true
      description: 证据快照标识
      schema:
        type: integer
        format: int64
        minimum: 1
  responses:
    BadRequest:
      description: 请求参数或请求体非法
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: 缺少令牌或令牌错误
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: 资源不存在（任务、企业、资产或关联）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: 任务当前状态不允许该操作
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Tampered:
      description: 证据校验失败，内容或签名可能已被篡改
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadGateway:
      description: 上游（GitHub API 或下载地址）访问失败
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UpdateConflict:
      description: 更新或回滚失败（校验和不匹配、冒烟失败、无备份等）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalError:
      description: 服务器内部错误
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unavailable:
      description: 任务运行时、事件流或自更新未就绪
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    MissionStatus:
      type: string
      description: 任务状态；终态为 done / failed / cancelled。
      enum:
        - queued
        - running
        - paused
        - finalizing
        - done
        - failed
        - cancelled
    Mission:
      type: object
      required: [tenant_id, id, name, goal, description, status, queued, reason, created_at, updated_at]
      properties:
        tenant_id:
          type: integer
          format: int64
        id:
          type: integer
          format: int64
        name:
          type: string
        goal:
          type: string
        description:
          type: string
        status:
          $ref: "#/components/schemas/MissionStatus"
        queued:
          type: boolean
          description: 是否在排队等待准入。
        queued_at:
          type: string
          format: date-time
          nullable: true
        started_at:
          type: string
          format: date-time
          nullable: true
        finished_at:
          type: string
          format: date-time
          nullable: true
        deadline_at:
          type: string
          format: date-time
          nullable: true
        reason:
          type: string
          description: 最近一次状态迁移的原因。
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        max_tokens:
          type: integer
          format: int64
          description: 任务的 token 预算；0 表示不限制。
        spent_tokens:
          type: integer
          format: int64
          description: 已累计消耗的 token 数。
        max_steps:
          type: integer
          description: 任务的步骤预算；0 表示不限制。
        steps_used:
          type: integer
          description: 已新增的计划步骤数。
    MissionList:
      type: object
      required: [missions]
      properties:
        missions:
          type: array
          items:
            $ref: "#/components/schemas/Mission"
    MissionCreateRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: 任务名称，不能为空。
        goal:
          type: string
        description:
          type: string
        max_tokens:
          type: integer
          format: int64
          default: 0
          description: 任务 token 预算；0 或不传表示不限制。
        max_steps:
          type: integer
          default: 0
          description: 任务步骤预算；0 或不传表示不限制。
    Approval:
      type: object
      required: [tenant_id, id, mission_id, node_id, tool, status, expires_at, created_at]
      properties:
        tenant_id:
          type: integer
          format: int64
        id:
          type: integer
          format: int64
        mission_id:
          type: integer
          format: int64
        node_id:
          type: integer
          format: int64
        tool:
          type: string
          description: 被审批的工具名。
        args:
          type: object
          additionalProperties: true
          description: 工具调用的原始参数（JSON 对象）。
        status:
          type: string
          description: 审批状态；只有 pending 可以被决策。
          enum: [pending, approved, rejected, timeout, cancelled]
        note:
          type: string
        decided_by:
          type: string
        decided_at:
          type: string
          format: date-time
          nullable: true
        expires_at:
          type: string
          format: date-time
          description: 审批过期时间。
        created_at:
          type: string
          format: date-time
    ApprovalList:
      type: object
      required: [approvals]
      properties:
        approvals:
          type: array
          items:
            $ref: "#/components/schemas/Approval"
    DecideApprovalRequest:
      type: object
      required: [approve]
      properties:
        approve:
          type: boolean
          description: true 表示批准，false 表示拒绝。
        note:
          type: string
          description: 决策备注，会写入审批记录。
    AuditEvent:
      type: object
      required: [tenant_id, id, mission_id, tool, action, rule_name, args_digest, outcome, detail, actor, created_at]
      properties:
        tenant_id:
          type: integer
          format: int64
        id:
          type: integer
          format: int64
        mission_id:
          type: integer
          format: int64
        node_id:
          type: integer
          format: int64
          nullable: true
          description: 触发工具调用的动作节点。
        tool:
          type: string
        action:
          type: string
          description: 策略裁决。
          enum: [allow, ask, deny]
        rule_name:
          type: string
          description: 命中的规则名；使用默认动作时为空。
        args_digest:
          type: string
          description: 工具参数原始 JSON 的 SHA-256 十六进制摘要。
        outcome:
          type: string
          description: 执行结果。
          enum: [executed, tool_error, denied_by_rule, rejected_by_user, approval_unavailable]
        detail:
          type: string
          description: 结果摘要或错误说明（可能被截断）。
        actor:
          type: string
        created_at:
          type: string
          format: date-time
    AuditList:
      type: object
      required: [audit]
      properties:
        audit:
          type: array
          items:
            $ref: "#/components/schemas/AuditEvent"
    TrafficExchange:
      type: object
      required: [tenant_id, id, mission_id, tool, phase, request_hash, request_size, response_hash, response_size, error, redaction, created_at]
      properties:
        tenant_id:
          type: integer
          format: int64
        id:
          type: integer
          format: int64
        mission_id:
          type: integer
          format: int64
        node_id:
          type: integer
          format: int64
          nullable: true
          description: 触发工具调用的动作节点。
        tool:
          type: string
        phase:
          type: string
          description: 采集阶段；intent 表示请求已登记，result 表示响应已写入。
          enum: [intent, result]
        request_hash:
          type: string
          description: 请求正文（脱敏后）的 SHA-256。
        request_size:
          type: integer
          format: int64
        response_hash:
          type: string
          description: 响应正文（脱敏后）的 SHA-256；未完成时为空。
        response_size:
          type: integer
          format: int64
        status_code:
          type: integer
          nullable: true
          description: 工具返回的 HTTP 状态码（http_probe）；其他工具为空。
        error:
          type: string
        redaction:
          type: string
          description: 采用的脱敏策略标记，例如 json-keys。
        created_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
          nullable: true
    TrafficList:
      type: object
      required: [traffic]
      properties:
        traffic:
          type: array
          items:
            $ref: "#/components/schemas/TrafficExchange"
    EvidenceSnapshot:
      type: object
      required: [tenant_id, id, mission_id, tool, request_hash, request_size, response_hash, response_size, signature, redaction, created_at]
      properties:
        tenant_id:
          type: integer
          format: int64
        id:
          type: integer
          format: int64
        mission_id:
          type: integer
          format: int64
        tool:
          type: string
        request_hash:
          type: string
        request_size:
          type: integer
          format: int64
        response_hash:
          type: string
        response_size:
          type: integer
          format: int64
        signature:
          type: string
          description: 对规范化元数据（含快照 ID）的 HMAC-SHA256。
        redaction:
          type: string
        created_at:
          type: string
          format: date-time
    VerifyResult:
      type: object
      required: [verified, evidence_id, signature]
      properties:
        verified:
          type: boolean
        evidence_id:
          type: integer
          format: int64
        signature:
          type: string
    ReleaseInfo:
      type: object
      required: [version, tag, url, published_at, asset_url, asset_name, checksum_url]
      properties:
        version:
          type: string
          description: 去掉 v 前缀的版本号。
        tag:
          type: string
          description: GitHub Release tag。
        url:
          type: string
          description: Release 页面地址。
        notes:
          type: string
          description: Release 说明（截断到 2000 字符）。
        published_at:
          type: string
          format: date-time
        asset_url:
          type: string
          description: 本平台发布包下载地址。
        asset_name:
          type: string
          description: 本平台发布包文件名。
        checksum_url:
          type: string
          description: SHA256SUMS 下载地址。
    UpdateCheckResult:
      type: object
      required: [has_update, release]
      properties:
        has_update:
          type: boolean
        release:
          $ref: "#/components/schemas/ReleaseInfo"
    UpdateApplyResult:
      type: object
      required: [updated, version, message]
      properties:
        updated:
          type: boolean
          description: 是否实际安装了新版本。
        version:
          type: string
        message:
          type: string
          description: 面向人的结果说明（成功需重启生效）。
    RollbackResult:
      type: object
      required: [rolled_back, message]
      properties:
        rolled_back:
          type: boolean
        message:
          type: string
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: 机器可读错误码，例如 bad_request / not_found / conflict / unauthorized / runtime_unavailable / sse_unavailable / replay_failed / internal_error。
            message:
              type: string
              description: 人类可读错误信息。
            request_id:
              type: string
              description: 请求标识，便于与服务端日志关联。
    Readiness:
      type: object
      required: [ready, checks]
      properties:
        ready:
          type: boolean
        checks:
          type: array
          items:
            type: object
            required: [name, ok]
            properties:
              name:
                type: string
              ok:
                type: boolean
              error:
                type: string
    SystemInfo:
