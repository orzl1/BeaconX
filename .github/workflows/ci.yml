name: 持续集成（CI）

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: "1.24"

jobs:
  lint:
    name: 代码检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: 格式检查（gofmt）
        run: |
          out=$(gofmt -l $(go list -f '{{.Dir}}' ./...))
          if [ -n "$out" ]; then echo "gofmt required:"; echo "$out"; exit 1; fi
      - name: 静态检查（go vet）
        run: go vet ./...
      - name: 品牌门禁
        run: ./scripts/check-brand.sh

  test:
    name: 单元测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: 单元测试
        run: go test -race -coverprofile=coverage.out ./...
      - name: 覆盖率汇总
        run: go tool cover -func=coverage.out | tail -1

  integration:
    name: 集成测试
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: beaconx
          POSTGRES_PASSWORD: beaconx
          POSTGRES_DB: beaconx
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U beaconx -d beaconx"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: 全量测试（含数据库集成测试）
        env:
          BEACONX_TEST_PG_DSN: postgres://beaconx:beaconx@127.0.0.1:5432/beaconx?sslmode=disable
        run: go test -count=1 ./...

  build:
    name: 构建（${{ matrix.goos }}/${{ matrix.goarch }}）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
          # Windows 不是 v1 的正式支持目标，但必须保持可编译，
          # 以保证后续支持的边际成本较低。参见 docs/roadmap.md。
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: 交叉编译
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -trimpath -o /tmp/beaconx-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/beaconx
      - name: Windows 静态检查
        if: matrix.goos == 'windows'
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: go vet ./...

  docker:
    name: 镜像构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: 构建镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: beaconx:ci
