name: beaconx

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-beaconx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-beaconx}
      POSTGRES_DB: ${POSTGRES_DB:-beaconx}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-beaconx} -d ${POSTGRES_DB:-beaconx}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  beaconx:
    build:
      context: .
      args:
        VERSION: ${BEACONX_VERSION:-dev}
        COMMIT: ${BEACONX_COMMIT:-unknown}
        BUILD_TIME: ${BEACONX_BUILD_TIME:-unknown}
    image: beaconx:dev
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      BEACONX_DB_DSN: postgres://${POSTGRES_USER:-beaconx}:${POSTGRES_PASSWORD:-beaconx}@postgres:5432/${POSTGRES_DB:-beaconx}?sslmode=disable
      BEACONX_ADDR: ":6969"
      BEACONX_HOME: /var/lib/beaconx
      BEACONX_LOG_LEVEL: ${BEACONX_LOG_LEVEL:-info}
      BEACONX_LOG_FORMAT: ${BEACONX_LOG_FORMAT:-json}
      BEACONX_ADMIN_TOKEN: ${BEACONX_ADMIN_TOKEN:-}
      BEACONX_MAX_CONCURRENT: ${BEACONX_MAX_CONCURRENT:-2}
      BEACONX_PLANNER_INTERVAL: ${BEACONX_PLANNER_INTERVAL:-2s}
      BEACONX_WORKER_INTERVAL: ${BEACONX_WORKER_INTERVAL:-200ms}
      BEACONX_LEASE_TTL: ${BEACONX_LEASE_TTL:-30s}
      BEACONX_HEARTBEAT_INTERVAL: ${BEACONX_HEARTBEAT_INTERVAL:-10s}
    ports:
      - "6969:6969"
    volumes:
      - beaconx_data:/var/lib/beaconx
    restart: unless-stopped

volumes:
  pgdata:
  beaconx_data:
